<!doctype html><html><head><base target="_top"><style>body{font:13px Arial;padding:12px;color:#202124}h3{margin:0 0 6px}.hint{color:#5f6368;margin-bottom:12px}.row{display:grid;grid-template-columns:24px 1fr 95px 95px 28px;gap:6px;align-items:center;border:1px solid #dadce0;border-radius:4px;padding:7px;margin:5px 0}.handle{cursor:grab;color:#5f6368}.label{font-weight:500}.meta{font-size:11px;color:#5f6368}.options{grid-column:2/5;width:100%;box-sizing:border-box;padding:5px}.actions{display:flex;gap:8px;margin-top:12px}button{padding:8px 12px;cursor:pointer}.hidden{display:none}.status{color:#5f6368;margin-top:10px}</style></head><body><h3>Configure BOM columns</h3><div class="hint">Drag rows to change display order. Onshape fields are protected; user columns can be checkboxes or dropdowns.</div><div id="columns">Loading…</div><div class="actions"><button onclick="addColumn()">Add user column</button><button onclick="save()">Save and apply</button><button onclick="resetConfig()">Reset defaults</button></div><div id="status" class="status"></div><script>
let config=[];function load(){google.script.run.withSuccessHandler(c=>{config=c;render()}).withFailureHandler(fail).getColumnConfig()}function render(){columns.innerHTML='';config.forEach((c,i)=>{const r=document.createElement('div');r.className='row';r.draggable=true;r.ondragstart=()=>r.dataset.drag=i;r.ondragover=e=>e.preventDefault();r.ondrop=()=>{const from=+r.dataset.drag;[config[from],config[i]]=[config[i],config[from]];render()};r.innerHTML='<span class="handle">☷</span><span><span class="label">'+esc(c.label)+'</span><br><span class="meta">'+esc(c.source)+' · '+esc(c.id)+'</span></span><select onchange="typeChange('+i+',this.value)" '+(c.source!=='user'?'disabled':'')+'><option>text</option><option>number</option><option>url</option><option>checkbox</option><option>dropdown</option></select><label><input type="checkbox" '+(c.enabled!==false?'checked':'')+' onchange="config['+i+'].enabled=this.checked"> On</label><button onclick="removeColumn('+i+')" '+(c.source!=='user'?'disabled':'')+'>×</button>';r.querySelector('select').value=c.type;if(c.type==='dropdown'){const o=document.createElement('input');o.className='options';o.placeholder='Dropdown options, comma separated';o.value=(c.options||[]).join(', ');o.onchange=()=>c.options=o.value.split(',').map(x=>x.trim()).filter(Boolean);r.appendChild(o)}columns.appendChild(r)})}function typeChange(i,v){config[i].type=v;render()}function addColumn(){const label=prompt('Column name');if(!label)return;const id=label.toLowerCase().replace(/[^a-z0-9]+(.)/g,(_,x)=>x.toUpperCase()).replace(/[^a-zA-Z0-9]/g,'');config.push({id:id||'custom'+Date.now(),label:label,source:'user',type:'checkbox',editable:true});render()}function removeColumn(i){config.splice(i,1);render()}function save(){status.textContent='Saving…';google.script.run.withSuccessHandler(()=>status.textContent='Saved and applied to the active BOM tab.').withFailureHandler(fail).saveColumnConfig(config)}function resetConfig(){load()}function fail(e){status.textContent='Error: '+e.message}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();</script></body></html>
