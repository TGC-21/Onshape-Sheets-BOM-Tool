<!doctype html><html><head><base target="_top"><style>body{font:13px Arial;padding:10px}textarea{width:100%;height:300px}button{padding:8px;margin-top:8px}</style></head><body><h3>Configure BOM Columns</h3><p>Reorder the entries in this JSON. IDs are stable, so user data follows the column definition.</p><textarea id="config"></textarea><button onclick="save()">Save and apply validation</button><div id="status"></div><script>google.script.run.withSuccessHandler(c=>document.getElementById('config').value=JSON.stringify(c||[],null,2)).getColumnConfig();function save(){try{const c=JSON.parse(document.getElementById('config').value);google.script.run.withSuccessHandler(()=>status.textContent='Saved.').withFailureHandler(e=>status.textContent='Error: '+e.message).saveColumnConfig(c)}catch(e){status.textContent='Invalid JSON: '+e.message}}</script></body></html>
